name: Build hasanaecommerce APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find buildsrc -name pubspec.yaml -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create . --platforms=android --project-name=hasanaecommerce --org=com.hasanaecommerce

      - name: Install packages
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasanaecommerce-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
